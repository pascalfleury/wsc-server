name: CI

on:
  push:
  pull_request:

env:
  # vcpkg is pinned so that all three platforms build the same dependency
  # versions; bump deliberately.
  VCPKG_COMMIT: 177e8175121536d414f405ed8b3099b325a42638
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vcpkg
      - run: cmake --preset dev
      - run: cmake --build --preset dev --config Debug
      - run: ctest --preset dev -C Debug

  format:
    name: clang-format
    # Pinned: formatting differs between clang-format versions; match the local one (18).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: clang-format-18 --version
      - run: git ls-files '*.h' '*.cc' | xargs clang-format-18 --dry-run --Werror

  sanitizers:
    name: ASan + UBSan + clang-tidy + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vcpkg
      - run: cmake --preset asan -DWSC_CLANG_TIDY=ON -DWSC_FUZZ=ON
      - run: cmake --build --preset asan
      - run: ctest --preset asan
      - run: |
          mkdir -p build/fuzz-corpus
          build/asan/fuzz/decode_fuzzer -max_total_time=60 build/fuzz-corpus tests/golden

  coverage:
    name: Coverage thresholds
    # Pinned: the LLVM tools are installed with a version suffix matching the image's clang.
    runs-on: ubuntu-24.04
    env:
      LLVM_SUFFIX: -18
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vcpkg
      - run: python3 tools/check_coverage.py --self-test
      - run: tools/coverage.sh
